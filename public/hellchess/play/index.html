<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HellChess — Play in Browser</title>
    <meta
      name="description"
      content="Play HellChess tactical dual-realm chess directly in desktop or mobile browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #0b0a10;
        --panel: #15131d;
        --border: rgba(255, 118, 56, 0.28);
        --text: #f4f2f7;
        --muted: #a6a0b5;
        --hell: #ff5b2e;
        --mortal: #4ade80;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background: var(--bg);
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: var(--bg);
        touch-action: none;
        outline: none;
      }

      #loading-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 91, 46, 0.2), transparent 55%),
          var(--bg);
        z-index: 20;
        transition: opacity 0.25s ease;
      }

      #loading-overlay.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-card {
        width: 100%;
        max-width: 380px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }

      .kicker {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--hell);
        background: rgba(255, 91, 46, 0.12);
        border: 1px solid rgba(255, 91, 46, 0.28);
        border-radius: 999px;
        padding: 4px 10px;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.05em;
      }

      .status {
        margin: 8px 0 18px;
        font-size: 13.5px;
        color: var(--muted);
      }

      .status strong {
        color: var(--mortal);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
      }

      .bar-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .bar-fill {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #dc2626, #ff5b2e);
        transition: width 0.12s linear;
      }

      .pct {
        margin-top: 10px;
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .error-box {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(220, 38, 38, 0.16);
        border: 1px solid rgba(220, 38, 38, 0.45);
        color: #fecaca;
        font-size: 13px;
        line-height: 1.45;
        display: none;
        text-align: left;
      }

      .back-link {
        display: inline-block;
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--muted);
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--text);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <div id="loading-overlay">
      <div class="loading-card">
        <span class="kicker">Browser Edition</span>
        <h1>HELLCHESS</h1>
        <p class="status" id="loading-status">Loading Dual-Realm Board...</p>
        <div class="bar-track">
          <div class="bar-fill" id="progress-fill"></div>
        </div>
        <div class="pct" id="progress-pct">0%</div>
        <div class="error-box" id="error-box"></div>
        <a class="back-link" id="back-link" href="../">Downloads &amp; App Launcher</a>
      </div>
    </div>

    <script>
      (function () {
        var canvas = document.getElementById("unity-canvas");
        var overlay = document.getElementById("loading-overlay");
        var fill = document.getElementById("progress-fill");
        var pct = document.getElementById("progress-pct");
        var statusEl = document.getElementById("loading-status");
        var errorBox = document.getElementById("error-box");
        var backLink = document.getElementById("back-link");

        var params = new URLSearchParams(window.location.search);
        var rawCode = (params.get("code") || params.get("join") || "").trim();
        if (/^[A-Za-z0-9.:-]{2,64}$/.test(rawCode)) {
          var normalized = rawCode.length === 6 && rawCode.indexOf(".") === -1
            ? rawCode.toUpperCase()
            : rawCode;
          statusEl.innerHTML = 'Loading match room <strong>' + normalized + '</strong>...';
          backLink.href = "../?code=" + encodeURIComponent(normalized);
        }

        function showError(msg) {
          errorBox.style.display = "block";
          errorBox.textContent = msg;
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
          arguments: [],
          dataUrl: buildUrl + "/WebGL.data.unityweb",
          frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
          codeUrl: buildUrl + "/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Scyan",
          productName: "HellChess",
          productVersion: "0.1.0",
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner: function (msg, type) {
            if (type === "error") showError(msg);
          }
        };

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            var p = Math.round(progress * 100);
            fill.style.width = p + "%";
            pct.textContent = p + "%";
          })
            .then(function () {
              overlay.classList.add("is-hidden");
              setTimeout(function () {
                overlay.style.display = "none";
              }, 300);
            })
            .catch(function (message) {
              showError("Failed to start HellChess WebGL: " + message);
            });
        };
        script.onerror = function () {
          showError("Could not load WebGL.loader.js. Please check your connection and refresh.");
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
